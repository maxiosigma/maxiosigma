title: Домашний переезд
description: >-
  Сайт стажировки (многостраничный) создан для прохождения вступительного
  испытания компании «Информационные технологии».


  Он был создан с использованием разных подходов к сеткам сайта.


  База создается с помощью сетки, а некоторые блоки создаются с помощью флексбокса и таблицы.


  С мобильной адаптацией.
