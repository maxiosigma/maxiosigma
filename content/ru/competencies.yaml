body:
    - title: Способен оставаться полностью функциональным, приспосабливаясь к изменяющимся обстоятельствам
    - title: Определяю высокие стандарты качества и стремлюсь к постоянному самосовершенствовани
    - title: Обнаруживаю проблемы, распознаю важную информацию и связи между различными видами данных
    - title: Обрабатываю подробную информацию эффективно и последовательно
    - title: Распознаю и создаю возможности, и действю в соответствии с ними
    - title: Генерирую идеи, инициируя новые стратегии, продукты и услуги
    - title: Действую, исходя из возможностей рынка с акцентом на клиента
    - title: 'Умею контролировать ход работы:  собственных задач, обязанностей и дел'
    - title: Умею самостоятельно выполнять свою работу в соответствии с профессиональными стандартами в своей области
    - title: Создаю хорошее первое впечатление и поддерживаю его в течение длительного времени
    - title: Осознаю соответствующие социальные, политические и профессиональные тенденции и события
    - title: Способнен вскрывать проблемы и систематически исследовать их различные составляющие, иметь полное представление о контексте и рассматривать проблему в целом
    - title: Умею чувствовать в себе индивидуальность, ценности, сильные и слабые стороны, интересы, амбиции и предпринимаю действия в целях повышения своей компетентности
    - title: Говорю на доступном языке и корректирую свою речь под уровень публики
    - title: Эффективно работаю с другими людьми для достижения общих целей
    - title: Способнен впитывать новую информацию и эффективно применять ее на практике
    - title: Создаю оригинальные, новаторские идеи и решения, следуя нестандартной точке зрения
    - title: Дипломатически управляю конфликтующими интересами и помогаю их решать
    - title: Умею быть активным и стойким в течение длительного периода времени, когда это требуется и соответствует общим интересам
